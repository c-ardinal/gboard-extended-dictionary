name: build-dictionary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Release assets of a private repository are not downloadable anonymously; fetch_inputs.py
      # then finds the file in place and only verifies its sha256. Harmless once the repo is public.
      - name: Download Wikidata snapshot (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download wikidata-20261012 -R "${{ github.repository }}"
          -p wikidata-p1814-ja-20261012.tsv -D input --clobber

      - name: Fetch pinned inputs (sha256 verified)
        run: python -I tools/fetch_inputs.py input

      - name: Unit tests
        run: python -I test_build_dictionary.py

      - name: Build
        run: >-
          python -I build_dictionary.py
          --base input/small_lex.csv input/core_lex.csv --extra input/notcore_lex.csv
          --wikidata input/wikidata-p1814-ja-20261012.tsv
          --mozc-dir input/mozc --out out

      - name: Self-check outputs
        run: |
          python -I -c "
          import glob, sys
          sys.path.insert(0, '.')
          import build_dictionary as bd
          for path in sorted(glob.glob('out/sudachi-ja-*.txt') + glob.glob('out/wikidata-ja-*.txt')):
              errors = bd.validate_text(open(path, encoding='utf-8', newline='').read())
              print(path, 'violations:', len(errors))
              if errors:
                  sys.exit(errors[0])
          "
          for f in out/sudachi-ja-*.txt out/wikidata-ja-*.txt; do
            test "$(awk -F'\t' 'NR>2 && NF!=4' "$f" | wc -l)" -eq 0
          done
          cat out/sha256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dictionary
          path: |
            out/sudachi-ja-*.txt
            out/wikidata-ja-*.txt
            out/*.zip
            out/sha256.txt
            out/stats.json
            LICENSE
            NOTICE

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dictionary
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Built from SudachiDict v20260723 and Wikidata 20261012. See NOTICE."
          gh release upload "$TAG" out/sudachi-ja-*.txt out/wikidata-ja-*.txt out/*.zip out/sha256.txt out/stats.json LICENSE NOTICE --clobber
